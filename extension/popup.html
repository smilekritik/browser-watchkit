<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WatchKit</title>
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <main class="settings">
    <header>
      <h1>WatchKit <span>for Chrome</span></h1>
      <label class="sharing-toggle">
        <input id="enabled" type="checkbox" role="switch" aria-label="Share activity on Discord">
        <span class="switch-track" aria-hidden="true"></span>
        <span class="sharing-on" aria-hidden="true">Sharing on</span>
        <span class="sharing-off" aria-hidden="true">Sharing off</span>
      </label>
    </header>
    <section aria-label="Discord activity" class="activity">
      <span class="play-mark" aria-hidden="true"></span>
      <div class="activity-copy">
        <p id="status" role="status">Loading…</p>
        <strong id="video"></strong>
        <p id="timing"></p>
      </div>
    </section>
    <div id="setup-row" hidden>
      <a class="primary button" href="https://github.com/smilekritik/browser-watchkit#get-a-discord-application-id" target="_blank" rel="noreferrer">Set up Discord</a>
    </div>
    <div class="preferences">
      <section class="panel" aria-labelledby="access-heading">
        <h2 id="access-heading">Website access</h2>
        <div class="access">
          <button id="allow-all" type="button">Allow all websites</button>
          <button id="allow-site" type="button">Allow this site</button>
        </div>
        <div class="current-site" id="current-site" hidden>
          <p><strong id="site-name"></strong></p>
          <p class="hint" id="site-state"></p>
          <div class="actions">
            <button id="pause-site" type="button" aria-describedby="pause-hint">Pause for this session</button>
            <button id="block-site" type="button">Exclude permanently</button>
            <button id="resume-site" type="button" hidden>Resume tracking</button>
          </div>
          <p class="hint" id="pause-hint">A pause ends when Chrome restarts.</p>
        </div>
        <div class="site-rules">
          <h3>Site exclusions</h3>
          <p class="hint">A domain rule includes its subdomains.</p>
          <form id="add-site">
            <label for="site-rule">Domain or URL</label>
            <div class="domain-input">
              <input id="site-rule" type="text" inputmode="url" placeholder="example.com" required>
              <button type="submit">Exclude</button>
            </div>
          </form>
          <p class="hint" id="rules-empty">No sites excluded or paused.</p>
          <ul id="rules-list"></ul>
        </div>
      </section>
      <section class="panel" aria-labelledby="discord-heading">
        <h2 id="discord-heading">Discord settings</h2>
        <p class="hint" id="application-hint"><a href="https://github.com/smilekritik/browser-watchkit#get-a-discord-application-id" target="_blank" rel="noreferrer">How to get an Application ID</a></p>
        <form id="config">
          <label for="application">Discord Application ID</label>
          <input id="application" inputmode="numeric" maxlength="20" pattern="[0-9]{16,20}" autocomplete="off" aria-describedby="application-hint">
          <label for="image">Fallback artwork key <span>(optional)</span></label>
          <input id="image" maxlength="64" pattern="[a-zA-Z0-9_\-]*" autocomplete="off">
          <div class="actions">
            <button class="primary" type="submit">Save</button>
            <button id="import-vlc" type="button">Import saved ID</button>
          </div>
        </form>
      </section>
    </div>
    <footer>
      <p id="notice" role="status">WatchKit shares video details from the selected tab.</p>
      <button id="shortcut-settings" type="button">Keyboard shortcut <kbd id="shortcut-key" hidden></kbd></button>
    </footer>
  </main>
</body>
</html>

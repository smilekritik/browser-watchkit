<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WatchKit</title>
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body class="popup">
  <main>
    <header class="topbar">
      <h1>WatchKit</h1>
      <button id="settings" class="icon-button" type="button" aria-label="Open settings" title="Settings">
        <svg class="icon" aria-hidden="true"><use href="icons.svg#settings"/></svg>
      </button>
    </header>
    <label class="sharing-toggle">
      <span>Share on Discord</span>
      <input id="enabled" type="checkbox" role="switch">
      <span class="switch-track" aria-hidden="true"></span>
    </label>
    <section class="activity" aria-label="Discord activity">
      <svg class="icon" aria-hidden="true"><use href="icons.svg#play"/></svg>
      <div>
        <p id="status" role="status">Loading…</p>
        <p id="connection-help" class="hint" hidden></p>
        <strong id="video"></strong>
        <p id="timing"></p>
      </div>
    </section>
    <button id="setup-row" class="primary setup" type="button" hidden>Set up Discord</button>
    <section id="current-site" class="site-panel" aria-label="Current website" hidden>
      <div class="site-header">
        <svg class="icon" aria-hidden="true"><use href="icons.svg#globe"/></svg>
        <div><strong id="site-name"></strong><p id="site-state" class="hint"></p></div>
      </div>
      <div class="actions">
        <button id="allow-site" type="button" hidden>Allow this site</button>
        <button id="pause-site" type="button" title="Tracking resumes after Chrome restarts" hidden>
          <svg class="icon" aria-hidden="true"><use href="icons.svg#pause"/></svg>Pause until restart
        </button>
        <button id="block-site" type="button">
          <svg class="icon" aria-hidden="true"><use href="icons.svg#ban"/></svg>Exclude site
        </button>
        <button id="resume-site" type="button" hidden>Resume tracking</button>
      </div>
    </section>
    <p id="notice" class="hint feedback" role="status"></p>
  </main>
</body>
</html>
